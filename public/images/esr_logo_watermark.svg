<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="goldYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(400, 400)" opacity="0.12">
    <!-- Outer Decorative Ring -->
    <circle r="360" fill="none" stroke="url(#goldYellowGrad)" stroke-width="4" stroke-dasharray="15 10"/>
    <circle r="340" fill="none" stroke="url(#whiteGrad)" stroke-width="2"/>
    <circle r="320" fill="none" stroke="url(#goldYellowGrad)" stroke-width="1.5"/>

    <!-- 8 Point Crown / Star Flourish -->
    <g fill="url(#goldYellowGrad)">
      <polygon points="0,-335 12,-320 -12,-320"/>
      <polygon points="0,335 12,320 -12,320"/>
      <polygon points="-335,0 -320,12 -320,-12"/>
      <polygon points="335,0 320,12 320,-12"/>
    </g>

    <!-- Main Shield Outline -->
    <path d="M 0,-240 L 180,-140 L 180,60 Q 180,200 0,260 Q -180,200 -180,60 L -180,-140 Z" 
          fill="none" stroke="url(#goldYellowGrad)" stroke-width="8" filter="url(#goldGlow)"/>
    <path d="M 0,-220 L 160,-128 L 160,50 Q 160,180 0,235 Q -160,180 -160,50 L -160,-128 Z" 
          fill="none" stroke="url(#whiteGrad)" stroke-width="3"/>

    <!-- Central Diamond Emblem -->
    <polygon points="0,-160 110,0 0,160 -110,0" fill="none" stroke="url(#goldYellowGrad)" stroke-width="5"/>
    <polygon points="0,-130 90,0 0,130 -90,0" fill="none" stroke="url(#whiteGrad)" stroke-width="2"/>

    <!-- Prominent ESR Letters -->
    <text x="0" y="35" font-family="'Outfit', 'Montserrat', sans-serif" font-size="110" font-weight="900" 
          text-anchor="middle" fill="url(#goldYellowGrad)" letter-spacing="6" filter="url(#goldGlow)">
      ESR
    </text>

    <!-- DEVELOPERS Subtitle -->
    <text x="0" y="105" font-family="'Inter', sans-serif" font-size="32" font-weight="800" 
          text-anchor="middle" fill="url(#whiteGrad)" letter-spacing="12">
      DEVELOPERS
    </text>

    <!-- Real Estate Icon / Roof Canopy -->
    <path d="M -90,-60 L 0,-130 L 90,-60" fill="none" stroke="url(#goldYellowGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M -70,-45 L 0,-105 L 70,-45" fill="none" stroke="url(#whiteGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Tagline Banner -->
    <path d="M -220,280 Q 0,310 220,280" fill="none" stroke="url(#goldYellowGrad)" stroke-width="2"/>
    <text x="0" y="305" font-family="'Inter', sans-serif" font-size="20" font-weight="700" 
          text-anchor="middle" fill="url(#whiteGrad)" letter-spacing="6">
      REAL ESTATE &amp; INFRA
    </text>
  </g>
</svg>
